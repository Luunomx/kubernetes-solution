<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" role="img" aria-labelledby="title desc">
  <title id="title">BulletinBoard production deployment flow</title>
  <desc id="desc">A numbered deployment flow from AWS and GitHub preparation through Terraform, Argo CD, EKS runtime verification and day-two operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="prepare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="delivery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <path d="M0,0 L0,10 L14,5 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-muted" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <path d="M0,0 L0,10 L14,5 z" fill="#93c5fd"/>
    </marker>
    <marker id="side-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M0,0 L0,10 L14,5 z" fill="#67e8f9"/>
    </marker>
    <marker id="side-arrow-muted" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M0,0 L0,10 L14,5 z" fill="#93c5fd"/>
    </marker>
    <marker id="side-arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M0,0 L0,10 L14,5 z" fill="#fcd34d"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .phase { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; letter-spacing: 1.6px; }
      .card-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .card-text { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .step { font: 800 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .flow-label { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; stroke: #0f172a; stroke-width: 3px; stroke-linejoin: round; paint-order: stroke fill; }
      .footer-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .footer-text { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
      .legend { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1500" height="1150" rx="28" fill="url(#bg)"/>
  <circle cx="1360" cy="90" r="250" fill="#4f46e5" opacity=".12"/>
  <circle cx="120" cy="1040" r="300" fill="#0891b2" opacity=".10"/>

  <text x="70" y="70" class="title">BulletinBoard production deployment flow</text>
  <text x="70" y="102" class="subtitle">One ordered path from a clean repository to a verified AWS EKS environment.</text>
  <text x="1430" y="78" class="flow-label" text-anchor="end">No deployment happens until the workflow is triggered and approved.</text>

  <text x="70" y="160" class="phase">PHASE 1 · PREPARE</text>
  <g>
    <rect filter="url(#shadow)" x="70" y="185" width="430" height="160" rx="18" fill="url(#prepare)"/>
    <circle cx="105" cy="220" r="22" fill="#93c5fd"/>
    <text x="105" y="220" class="step">1</text>
    <text x="145" y="226" class="card-title">Prerequisites</text>
    <text x="100" y="264" class="card-text">AWS account, region, quotas + naming</text>
    <text x="100" y="289" class="card-text">GitHub repo, GHCR + optional Route 53</text>
    <text x="100" y="314" class="card-text">Runner with AWS CLI, Terraform + kubectl</text>
  </g>
  <g>
    <rect filter="url(#shadow)" x="535" y="185" width="430" height="160" rx="18" fill="url(#prepare)"/>
    <circle cx="570" cy="220" r="22" fill="#93c5fd"/>
    <text x="570" y="220" class="step">2</text>
    <text x="610" y="226" class="card-title">Trust + access</text>
    <text x="565" y="264" class="card-text">GitHub Actions OIDC + restricted IAM</text>
    <text x="565" y="289" class="card-text">Repository + approved ref only</text>
    <text x="565" y="314" class="card-text">Protected production Environment</text>
    <text x="565" y="339" class="card-text">Required reviewers</text>
  </g>
  <g>
    <rect filter="url(#shadow)" x="1000" y="185" width="430" height="160" rx="18" fill="url(#prepare)"/>
    <circle cx="1035" cy="220" r="22" fill="#93c5fd"/>
    <text x="1035" y="220" class="step">3</text>
    <text x="1075" y="226" class="card-title">Settings + secrets</text>
    <text x="1030" y="264" class="card-text">Production profile, cluster settings + CIDRs</text>
    <text x="1030" y="289" class="card-text">MongoDB credentials, TLS + observability</text>
    <text x="1030" y="314" class="card-text">Redis + notifications when configured</text>
  </g>
  <path d="M503 265 L518 265" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="butt" marker-end="url(#side-arrow-muted)"/>
  <path d="M968 265 L983 265" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="butt" marker-end="url(#side-arrow-muted)"/>

  <text x="70" y="395" class="phase">PHASE 2 · PROVISION</text>
  <g>
    <rect filter="url(#shadow)" x="70" y="420" width="430" height="160" rx="18" fill="url(#delivery)"/>
    <circle cx="105" cy="455" r="22" fill="#67e8f9"/>
    <text x="105" y="455" class="step">4</text>
    <text x="145" y="461" class="card-title">Build + publish</text>
    <text x="100" y="499" class="card-text">Test frontend + API, then build images</text>
    <text x="100" y="524" class="card-text">Scan SBOM/provenance + sign with cosign</text>
    <text x="100" y="549" class="card-text">Publish immutable SHA-tagged images to GHCR</text>
  </g>
  <g>
    <rect filter="url(#shadow)" x="535" y="420" width="430" height="160" rx="18" fill="url(#delivery)"/>
    <circle cx="570" cy="455" r="22" fill="#67e8f9"/>
    <text x="570" y="455" class="step">5</text>
    <text x="610" y="461" class="card-title">Bootstrap state</text>
    <text x="565" y="499" class="card-text">Create/reuse private S3 state + lock</text>
    <text x="565" y="524" class="card-text">Encryption, versioning + transport protection</text>
    <text x="565" y="549" class="card-text">PITR enabled</text>
    <text x="565" y="574" class="card-text">Keep state, plans and credentials outside Git</text>
  </g>
  <g>
    <rect filter="url(#shadow)" x="1000" y="420" width="430" height="160" rx="18" fill="url(#delivery)"/>
    <circle cx="1035" cy="455" r="22" fill="#67e8f9"/>
    <text x="1035" y="455" class="step">6</text>
    <text x="1075" y="461" class="card-title">Terraform apply</text>
    <text x="1030" y="499" class="card-text">Plan → production approval → reviewed apply</text>
    <text x="1030" y="524" class="card-text">Create VPC, EKS nodes, EBS CSI + IRSA</text>
    <text x="1030" y="549" class="card-text">KMS/logs, storage and secret wiring</text>
    <text x="1030" y="574" class="card-text">Environment outputs</text>
  </g>
  <path d="M1215 345 C1215 350 1000 365 760 365 C520 365 240 365 40 365 L40 500 L56 500" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="butt" marker-end="url(#side-arrow)"/>
  <text x="760" y="383" class="flow-label" text-anchor="middle">continue</text>
  <path d="M503 500 L518 500" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="butt" marker-end="url(#side-arrow)"/>
  <path d="M968 500 L983 500" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="butt" marker-end="url(#side-arrow)"/>

  <text x="70" y="630" class="phase">PHASE 3 · RECONCILE + VERIFY</text>
  <g>
    <rect filter="url(#shadow)" x="70" y="655" width="430" height="160" rx="18" fill="url(#runtime)"/>
    <circle cx="105" cy="690" r="22" fill="#67e8f9"/>
    <text x="105" y="690" class="step">7</text>
    <text x="145" y="696" class="card-title">Bootstrap Argo CD</text>
    <text x="100" y="734" class="card-text">Install Argo CD + External Secrets</text>
    <text x="100" y="759" class="card-text">Register root app and inject</text>
    <text x="100" y="784" class="card-text">environment-specific values outside Git</text>
  </g>
  <g>
    <rect filter="url(#shadow)" x="535" y="655" width="430" height="160" rx="18" fill="url(#runtime)"/>
    <circle cx="570" cy="690" r="22" fill="#67e8f9"/>
    <text x="570" y="690" class="step">8</text>
    <text x="610" y="696" class="card-title">Reconcile EKS runtime</text>
    <text x="565" y="734" class="card-text">NGINX NLB + cert-manager + MongoDB</text>
    <text x="565" y="759" class="card-text">Operator, Helm release + Redis guardrails</text>
    <text x="565" y="784" class="card-text">Prometheus, Grafana, Loki/Alloy + Tempo</text>
  </g>
  <g>
    <rect filter="url(#shadow)" x="1000" y="655" width="430" height="160" rx="18" fill="url(#runtime)"/>
    <circle cx="1035" cy="690" r="22" fill="#67e8f9"/>
    <text x="1035" y="690" class="step">9</text>
    <text x="1075" y="696" class="card-title">DNS + verify</text>
    <text x="1030" y="730" class="card-text">Route 53 → NLB; verify ACME + HTTPS</text>
    <text x="1030" y="750" class="card-text">Check Argo, probes, MongoDB + WebSockets</text>
    <text x="1030" y="770" class="card-text">Confirm HPA/PDB and production guardrails</text>
    <text x="1030" y="790" class="card-text">Test backup/restore + alerting</text>
  </g>
  <path d="M503 735 L518 735" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="butt" marker-end="url(#side-arrow)"/>
  <path d="M968 735 L983 735" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="butt" marker-end="url(#side-arrow)"/>
  <path d="M1215 580 C1215 585 1000 600 760 600 C520 600 240 600 40 600 L40 735 L56 735" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="butt" marker-end="url(#side-arrow)"/>
  <text x="760" y="618" class="flow-label" text-anchor="middle">continue</text>
  <path d="M1215 815 C1215 825 1000 840 760 840 C520 840 240 840 40 840 L40 940 L56 940" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#side-arrow-amber)"/>
  <text x="760" y="830" class="flow-label" text-anchor="middle">gate</text>

  <g>
    <rect filter="url(#shadow)" x="70" y="865" width="1360" height="190" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="105" cy="905" r="22" fill="#fcd34d"/>
    <text x="105" y="905" class="step">10</text>
    <text x="145" y="911" class="footer-title">Production gate + day-two operations</text>
    <line x1="750" y1="890" x2="750" y2="1028" stroke="#334155" stroke-width="2"/>
    <text x="100" y="956" class="footer-title">Before public traffic</text>
    <text x="100" y="982" class="footer-text">Auth/moderation · HTTPS/WAF · private operators · Redis scale test</text>
    <text x="100" y="1007" class="footer-text">Restore evidence/RPO/RTO · actionable alerts · signed-image admission</text>
    <text x="100" y="1032" class="footer-text">NetworkPolicies · strict Pod Security · secret rotation · runbooks</text>
    <text x="1090" y="926" class="footer-title" text-anchor="middle">After go-live</text>
    <text x="1090" y="952" class="footer-text" text-anchor="middle">App push → publish-images → GitOps SHA → Argo CD rollout</text>
    <text x="1090" y="978" class="footer-text" text-anchor="middle">Infra change → Terraform plan → approval → idempotent apply</text>
    <text x="1090" y="1004" class="footer-text" text-anchor="middle">Monitor, upgrade, back up, restore and record operational evidence</text>
  </g>

  <line x1="70" y1="1090" x2="100" y2="1090" stroke="#93c5fd" stroke-width="3" marker-end="url(#side-arrow-muted)"/>
  <text x="115" y="1095" class="legend">prepare / access</text>
  <line x1="300" y1="1090" x2="330" y2="1090" stroke="#67e8f9" stroke-width="3" marker-end="url(#side-arrow)"/>
  <text x="345" y="1095" class="legend">automated delivery</text>
  <line x1="560" y1="1090" x2="590" y2="1090" stroke="#fcd34d" stroke-width="3" marker-end="url(#side-arrow-amber)"/>
  <text x="605" y="1095" class="legend">production gate / operator decision</text>
  <text x="1430" y="1095" class="legend" text-anchor="end">Template flow · review every environment-specific value</text>
</svg>
