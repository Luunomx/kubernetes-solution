name: Build and publish container images

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - "simple-fluid-page/**"
      - "docker-compose.yml"
      - ".github/workflows/publish-images.yml"
  workflow_call:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: bulletinboard-image-promotion
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      GITOPS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simple-fluid-page/package-lock.json

      - name: Check frontend
        working-directory: simple-fluid-page
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Test API
        run: dotnet test tests/BulletinBoard.Tests/BulletinBoard.Tests.csproj --configuration Release

      - name: Normalize image namespace
        id: image_namespace
        run: echo "value=${IMAGE_NAMESPACE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        id: backend_image
        with:
          context: ./webapp
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ steps.image_namespace.outputs.value }}/bulletinboard-backend:${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        id: frontend_image
        with:
          context: ./simple-fluid-page
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ steps.image_namespace.outputs.value }}/bulletinboard-frontend:${{ github.sha }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ steps.image_namespace.outputs.value }}/bulletinboard-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ steps.image_namespace.outputs.value }}/bulletinboard-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with GitHub OIDC
        env:
          COSIGN_EXPERIMENTAL: "1"
          BACKEND_IMAGE: ghcr.io/${{ steps.image_namespace.outputs.value }}/bulletinboard-backend
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.image_namespace.outputs.value }}/bulletinboard-frontend
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes \
            "${BACKEND_IMAGE}@${BACKEND_DIGEST}" \
            "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

      - name: Promote images in Helm values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          values="k8s/helm/bulletinboard/values.yaml"
          image_namespace="${IMAGE_NAMESPACE,,}"
          sed -i -E "s#(repository: ghcr\\.io/)[^/]+/(bulletinboard-(backend|frontend))#\\1${image_namespace}/\\2#" "$values"
          sed -i -E "/repository: ghcr\\.io\\/[^/]+\\/bulletinboard-backend/{n;s/(tag: ).*/\\1${IMAGE_TAG}/;}" "$values"
          sed -i -E "/repository: ghcr\\.io\\/[^/]+\\/bulletinboard-frontend/{n;s/(tag: ).*/\\1${IMAGE_TAG}/;}" "$values"

          for gitops_file in gitops/apps/root-app.yaml gitops/apps/bulletinboard-app.yaml gitops/apps/mongodb-instance-app.yaml; do
            sed -i -E "s#https://github\\.com/[^/' ]+/[^/' ]+\\.git#${GITOPS_REPOSITORY}#g" "$gitops_file"
            sed -i -E "/repoURL: .*github\\.com\\//{n;s|^([[:space:]]*targetRevision: ).*|\\1${GITHUB_REF_NAME}|;}" "$gitops_file"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/bulletinboard/values.yaml gitops/apps/*.yaml
          git diff --cached --quiet || git commit -m "chore: promote images ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
