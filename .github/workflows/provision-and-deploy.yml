name: Provision and deploy EKS

on:
  workflow_dispatch:
    inputs:
      bootstrap_argocd:
        description: Bootstrap Argo CD and GitOps after Terraform creates or updates EKS
        required: true
        default: true
        type: boolean
      create_mongodb_secret:
        description: Create the AWS Secrets Manager container when it does not already exist
        required: true
        default: true
        type: boolean
      gitops_revision:
        description: Git revision Argo CD should track
        required: true
        default: main
        type: string
      publish_images:
        description: Build, scan, sign and publish application images before provisioning
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: bulletinboard-provision
  cancel-in-progress: false

jobs:
  publish-images:
    name: Build and publish the application images
    if: ${{ inputs.publish_images }}
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: write
      id-token: write
      packages: write

  provision-and-deploy:
    name: Provision infrastructure and bootstrap GitOps
    needs: publish-images
    if: ${{ always() && (needs.publish-images.result == 'success' || needs.publish-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'bulletinboard' }}
      CLUSTER_VERSION: ${{ vars.CLUSTER_VERSION || '1.36' }}
      DEPLOYMENT_PROFILE: ${{ vars.DEPLOYMENT_PROFILE || 'demo' }}
      PRODUCTION_PROFILE: ${{ vars.PRODUCTION_PROFILE || 'false' }}
      MONGODB_SECRET_NAME: ${{ vars.MONGODB_SECRET_NAME || 'bulletinboard/mongodb' }}
      ENABLE_CERT_MANAGER_TLS: ${{ vars.ENABLE_CERT_MANAGER_TLS || 'false' }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID || '' }}
      TLS_HOST: ${{ vars.TLS_HOST || '' }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL || '' }}
      ENABLE_MONGODB_BACKUP: ${{ vars.ENABLE_MONGODB_BACKUP || 'false' }}
      MONGODB_BACKUP_BUCKET_NAME: ${{ vars.MONGODB_BACKUP_BUCKET_NAME || '' }}
      MONGODB_BACKUP_RETENTION_DAYS: ${{ vars.MONGODB_BACKUP_RETENTION_DAYS || '30' }}
      ENABLE_ARGOCD_NOTIFICATIONS: ${{ vars.ENABLE_ARGOCD_NOTIFICATIONS || 'false' }}
      ENABLE_OBSERVABILITY: ${{ vars.ENABLE_OBSERVABILITY || 'false' }}
      OBSERVABILITY_LOGS_BUCKET_NAME: ${{ vars.OBSERVABILITY_LOGS_BUCKET_NAME || '' }}
      OBSERVABILITY_TRACES_BUCKET_NAME: ${{ vars.OBSERVABILITY_TRACES_BUCKET_NAME || '' }}
      OBSERVABILITY_RETENTION_DAYS: ${{ vars.OBSERVABILITY_RETENTION_DAYS || '30' }}
      ENABLE_EKS_SECRETS_ENCRYPTION: ${{ vars.ENABLE_EKS_SECRETS_ENCRYPTION || 'false' }}
      CLUSTER_ENDPOINT_PRIVATE_ACCESS: ${{ vars.CLUSTER_ENDPOINT_PRIVATE_ACCESS || 'true' }}
      CLUSTER_ENDPOINT_PUBLIC_ACCESS: ${{ vars.CLUSTER_ENDPOINT_PUBLIC_ACCESS || 'true' }}
      CLUSTER_PUBLIC_ACCESS_CIDRS: ${{ vars.CLUSTER_PUBLIC_ACCESS_CIDRS || '0.0.0.0/0' }}
      CLUSTER_ENABLED_LOG_TYPES: ${{ vars.CLUSTER_ENABLED_LOG_TYPES || '' }}
      CLUSTER_ACCESS_ENTRIES_JSON: ${{ vars.CLUSTER_ACCESS_ENTRIES_JSON || '' }}
      ENABLE_REDIS_REALTIME: ${{ vars.ENABLE_REDIS_REALTIME || 'false' }}
      REDIS_SECRET_NAME: ${{ vars.REDIS_SECRET_NAME || 'bulletinboard-redis' }}
      ENABLE_ALERTMANAGER_NOTIFICATIONS: ${{ vars.ENABLE_ALERTMANAGER_NOTIFICATIONS || 'false' }}
      ALERTMANAGER_SECRET_NAME: ${{ vars.ALERTMANAGER_SECRET_NAME || 'alertmanager-webhook' }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      BOOTSTRAP_ARGOCD: ${{ inputs.bootstrap_argocd }}
      CREATE_MONGODB_SECRET: ${{ inputs.create_mongodb_secret }}
      GITOPS_REVISION: ${{ inputs.gitops_revision }}
      MONGODB_SECRET_JSON: ${{ secrets.MONGODB_SECRET_JSON }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required deployment settings
        run: |
          set -eu
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN is required." >&2; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is required." >&2; exit 1; }
          test -n "$TF_LOCK_TABLE" || { echo "TF_LOCK_TABLE is required." >&2; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bulletinboard-provision

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Resolve MongoDB secret mode
        run: |
          set -eu
          if [ -n "$MONGODB_SECRET_JSON" ]; then
            jq -e 'type == "object" and (.username | type == "string") and (.password | type == "string")' \
              >/dev/null <<<"$MONGODB_SECRET_JSON"
          fi

          if aws secretsmanager describe-secret \
              --secret-id "$MONGODB_SECRET_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "MongoDB secret already exists; Terraform will reuse it."
            echo "CREATE_MONGODB_SECRET=false" >> "$GITHUB_ENV"
          elif [ "$CREATE_MONGODB_SECRET" = "true" ]; then
            test -n "$MONGODB_SECRET_JSON" || {
              echo "MONGODB_SECRET_JSON is required when creating a new MongoDB secret." >&2
              exit 1
            }
          else
            echo "create_mongodb_secret=false but the MongoDB secret was not found." >&2
            exit 1
          fi

      - name: Bootstrap remote Terraform state
        run: bash infrastructure/eks/scripts/bootstrap-state.sh

      - name: Initialize Terraform
        run: |
          terraform -chdir=infrastructure/eks init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="region=${AWS_REGION}"

      - name: Plan infrastructure and GitOps bootstrap
        run: |
          set -eu
          terraform_args=(
            -input=false
            -lock-timeout=5m
            -var-file=terraform.tfvars.example
            "-var=region=${AWS_REGION}"
            "-var=name=${CLUSTER_NAME}"
            "-var=cluster_version=${CLUSTER_VERSION}"
            "-var=deployment_profile=${DEPLOYMENT_PROFILE}"
            "-var=production_profile=${PRODUCTION_PROFILE}"
            "-var=mongodb_secret_name=${MONGODB_SECRET_NAME}"
            "-var=create_mongodb_secret=${CREATE_MONGODB_SECRET}"
            "-var=enable_cert_manager_tls=${ENABLE_CERT_MANAGER_TLS}"
            "-var=route53_hosted_zone_id=${ROUTE53_HOSTED_ZONE_ID}"
            "-var=tls_host=${TLS_HOST}"
            "-var=acme_email=${ACME_EMAIL}"
            "-var=enable_mongodb_backup=${ENABLE_MONGODB_BACKUP}"
            "-var=mongodb_backup_retention_days=${MONGODB_BACKUP_RETENTION_DAYS}"
            "-var=enable_argocd_notifications=${ENABLE_ARGOCD_NOTIFICATIONS}"
            "-var=enable_observability=${ENABLE_OBSERVABILITY}"
            "-var=observability_retention_days=${OBSERVABILITY_RETENTION_DAYS}"
            "-var=enable_eks_secrets_encryption=${ENABLE_EKS_SECRETS_ENCRYPTION}"
            "-var=cluster_endpoint_private_access=${CLUSTER_ENDPOINT_PRIVATE_ACCESS}"
            "-var=cluster_endpoint_public_access=${CLUSTER_ENDPOINT_PUBLIC_ACCESS}"
            "-var=enable_redis_realtime=${ENABLE_REDIS_REALTIME}"
            "-var=redis_secret_name=${REDIS_SECRET_NAME}"
            "-var=enable_alertmanager_notifications=${ENABLE_ALERTMANAGER_NOTIFICATIONS}"
            "-var=alertmanager_secret_name=${ALERTMANAGER_SECRET_NAME}"
            "-var=bootstrap_argocd=${BOOTSTRAP_ARGOCD}"
            "-var=gitops_repository_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            "-var=gitops_revision=${GITOPS_REVISION}"
            -out=tfplan
          )
          if [ -n "$MONGODB_BACKUP_BUCKET_NAME" ]; then
            terraform_args+=("-var=mongodb_backup_bucket_name=${MONGODB_BACKUP_BUCKET_NAME}")
          fi
          if [ -n "$OBSERVABILITY_LOGS_BUCKET_NAME" ]; then
            terraform_args+=("-var=observability_logs_bucket_name=${OBSERVABILITY_LOGS_BUCKET_NAME}")
          fi
          if [ -n "$OBSERVABILITY_TRACES_BUCKET_NAME" ]; then
            terraform_args+=("-var=observability_traces_bucket_name=${OBSERVABILITY_TRACES_BUCKET_NAME}")
          fi
          if [ -n "$CLUSTER_PUBLIC_ACCESS_CIDRS" ]; then
            terraform_args+=("-var=cluster_endpoint_public_access_cidrs=[\"${CLUSTER_PUBLIC_ACCESS_CIDRS//,/\",\"}\"]")
          fi
          if [ -n "$CLUSTER_ENABLED_LOG_TYPES" ]; then
            terraform_args+=("-var=cluster_enabled_log_types=[\"${CLUSTER_ENABLED_LOG_TYPES//,/\",\"}\"]")
          fi
          if [ -n "$CLUSTER_ACCESS_ENTRIES_JSON" ]; then
            terraform_args+=("-var=cluster_access_entries=${CLUSTER_ACCESS_ENTRIES_JSON}")
          fi
          terraform -chdir=infrastructure/eks plan "${terraform_args[@]}"

      - name: Apply infrastructure and GitOps bootstrap
        run: terraform -chdir=infrastructure/eks apply -input=false -lock-timeout=5m tfplan

      - name: Populate MongoDB secret value when provided
        if: ${{ env.MONGODB_SECRET_JSON != '' }}
        run: |
          set -eu
          SECRET_NAME="$(terraform -chdir=infrastructure/eks output -raw mongodb_secret_name)"
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_NAME" \
            --secret-string "$MONGODB_SECRET_JSON"
          if kubectl -n bulletinboard get externalsecret mongo-root-secret >/dev/null 2>&1; then
            kubectl -n bulletinboard annotate externalsecret mongo-root-secret \
              force-sync="$(date +%s)" --overwrite
            kubectl -n bulletinboard wait --for=condition=Ready \
              externalsecret/mongo-root-secret --timeout=5m
          fi

      - name: Verify cluster and Argo CD
        run: |
          set -eu
          EKS_CLUSTER_NAME="$(terraform -chdir=infrastructure/eks output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          if [ "$BOOTSTRAP_ARGOCD" = "true" ]; then
            kubectl -n argocd get application root-app
          fi
          terraform -chdir=infrastructure/eks output
