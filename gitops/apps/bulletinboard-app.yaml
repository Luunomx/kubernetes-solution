apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bulletinboard
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.bulletinboard-events: ""
    notifications.argoproj.io/subscribe.on-sync-failed.bulletinboard-events: ""
    notifications.argoproj.io/subscribe.on-health-degraded.bulletinboard-events: ""
spec:
  project: default
  source:
    repoURL: 'https://github.com/luunomx/kubernetes-solution.git'
    targetRevision: main
    path: k8s/helm/bulletinboard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bulletinboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
