apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/luunomx/kubernetes-solution.git
    targetRevision: main
    path: gitops/apps
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: bulletinboard
      namespace: argocd
      jsonPointers:
        - /spec/source/helm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
